      # Cron Trigger repair + diagnostics: `wrangler deploy` prints "Deployed
      # triggers" even when the schedule silently stops firing (observed
      # 2026-08-14: the worker's persisted tick counter stayed null for hours
      # while HTTP-driven scans ran fine — scheduled events never arrived even
      # after PUT-over-same re-provision). A DELETE + recreate is the API
      # equivalent of toggling the trigger in the dashboard, which is the
      # standard remedy for silent cron-delivery failures.
      - name: Re-provision cron schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/solana-meme-bot"
          echo "::group::DELETE schedule"
          curl -sS -X DELETE -H "$AUTH" "$API/schedules" | tee /tmp/sched_del.json
          echo
          echo "::endgroup::"
          grep -q '"success": true' /tmp/sched_del.json && echo "::notice::Cron schedule deleted" || echo "::error::Cron schedule DELETE failed"
          echo "::group::PUT schedule (recreate)"
          curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            -d '[{"cron":"* * * * *"}]' "$API/schedules" | tee /tmp/sched_put.json
          echo
          echo "::endgroup::"
          grep -q '"success": true' /tmp/sched_put.json && echo "::notice::Cron schedule recreated" || echo "::error::Cron schedule PUT failed"
          echo "::group::Verify schedule"
          curl -sS -H "$AUTH" "$API/schedules" | tee /tmp/sched.json
          echo
          echo "::endgroup::"
          grep -q '\* \* \* \* \*' /tmp/sched.json && echo "::notice::Cron schedule * * * * * verified bound" || echo "::error::Cron schedule not found after recreate"
          echo "::group::Deployments"
          curl -sS -H "$AUTH" "$API/deployments" | head -c 4000
          echo
          echo "::endgroup::"
