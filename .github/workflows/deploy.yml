name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline unit tests (local libsql file: DB — no network, no secrets).
      # Guards the settings schema/migration, the re-eval pool query, the
      # batched token_stats methods and the /filter argument parser.
      - name: Unit tests
        run: npm run test:unit

      # Deploy first: with Cloudflare's versioning model, `wrangler secret put`
      # refuses to bind a secret when the latest Worker version is an
      # un-deployed draft (e.g. a dashboard edit that was saved but not
      # deployed). Deploying first makes the latest version the deployed one,
      # so the secret write below succeeds instead of blocking the release.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Write HELIUS_API_KEY as a Worker secret so the on-chain volume
      # resolver runs at full speed. Best-effort by design: if the GitHub
      # Actions secret is unset, or the write hits a transient Cloudflare
      # versioning conflict, the worker still runs (graceful fallback to
      # public RPC) — never block a release on it. GitHub forbids referencing
      # secrets in `if:` conditions, hence the shell guard.
      - name: Set HELIUS_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            if echo "$HELIUS_API_KEY" | npx wrangler secret put HELIUS_API_KEY; then
              echo "::notice::HELIUS_API_KEY written to Worker secret"
            else
              echo "::warning::HELIUS_API_KEY secret update failed (see above) — continuing, the worker falls back to public RPC"
            fi
          else
            echo "::warning::HELIUS_API_KEY not set as a GitHub Actions secret — skipping (fallback to public RPC)"
          fi
