# This workflow is ALSO the Turso → D1 cutover (2026-10-15). See
# docs/d1-migration-2026-10-15.md for the whole plan; the short version:
#
#   migrate  creates the D1 database if the account has none, applies the
#            schema by running the Worker's OWN `Db.init()` against it, and
#            copies every row out of the Turso archive (once — a marker in
#            worker_state makes every later run a no-op).
#   deploy   injects the `[[d1_databases]]` binding into the runner's own
#            wrangler.toml and deploys. BINDING PRESENCE IS THE STORE SWITCH
#            (see src/worker.ts), so this deploy is the cutover and everything
#            above it must succeed first: a failed copy never reaches prod.
#   catchup  runs AFTER the deploy and fills the rows written during the
#            copy→deploy window (insert-if-missing only: from the deploy onward
#            D1 holds the newer truth, and overwriting it would roll live state
#            backward).
#
# Rollback BEFORE the deploy step: nothing to undo, the Worker is still on
# Turso. Rollback AFTER it: revert this file and redeploy — writes made to D1
# since the cutover are lost, which is why it has to be immediate.
name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      catchup:
        description: "Force the Turso→D1 catch-up (fills rows D1 lacks; never overwrites)"
        type: boolean
        default: false

# One run at a time. The migration reads the entire archive and writes D1, and
# two overlapping runs could interleave a seed with a catch-up — or two binds
# with two deploys.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

# The database the binding points at. It is created/LOOKED UP by name on every
# run, so no database id is ever committed (see scripts/d1-bind.js).
env:
  D1_DATABASE_NAME: solana-meme-bot

jobs:
  # Make the D1 database exist and hold the archive's rows BEFORE anything can
  # switch production onto it.
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      database_id: ${{ steps.database.outputs.database_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The migration scripts require the built Worker: the schema is applied by
      # running the real Db.init() from dist/db.js through dist/d1.js's
      # transport, and the copy's chunk rule is chunkForParamLimit.
      - name: Build
        run: npm run build

      - name: Ensure the D1 database exists
        id: database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1-copy.js ensure

      - name: Apply the schema (the Worker's own init) to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.database.outputs.database_id }}
        run: node scripts/d1-copy.js schema

      # Reads the Turso archive (the only place the state exists today) and
      # writes D1. Idempotent, and a no-op once worker_state.d1_seed_v1 is set —
      # which is what keeps a later deploy from overwriting live D1 state with a
      # frozen archive.
      - name: Seed D1 from the Turso archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.database.outputs.database_id }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/d1-copy.js seed

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline unit tests (local libsql file: DB — no network, no secrets).
      # Guards the settings schema/migration, the re-eval pool query, the
      # batched token_stats methods and the /filter argument parser.
      - name: Unit tests
        run: npm run test:unit

      # The cutover itself. The binding is written into THIS runner's checkout
      # (never committed), and its presence in the deployed Worker is what makes
      # every read and write go to D1 instead of Turso.
      - name: Inject the D1 binding
        env:
          D1_DATABASE_ID: ${{ needs.migrate.outputs.database_id }}
        run: node scripts/d1-bind.js --database-id "$D1_DATABASE_ID" --name "$D1_DATABASE_NAME"

      # The cold-archive R2 binding (2026-10-17). Best-effort by design: the
      # script creates the bucket and injects `[[r2_buckets]]` only when the
      # token can reach R2. Without R2:Edit it prints a warning and exits 0,
      # leaving wrangler.toml exactly as it was — because `wrangler deploy`
      # refuses a binding whose bucket does not exist, an unconditional block
      # here would break every deploy until the permission is granted.
      - name: Bind the cold-archive R2 bucket (best effort)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: solana-meme-bot-cold
        run: node scripts/r2-bind.js

      # Deploy first: with Cloudflare's versioning model, `wrangler secret put`
      # refuses to bind a secret when the latest Worker version is an
      # un-deployed draft (e.g. a dashboard edit that was saved but not
      # deployed). Deploying first makes the latest version the deployed one,
      # so the secret write below succeeds instead of blocking the release.
      # Note: cron delivery to this Worker is currently broken on Cloudflare's
      # side (2026-08-14 — schedule bound but events never arrive); the
      # scanner is driven by external /health polling (HetrixTools, 1-min)
      # instead. wrangler deploy keeps the trigger configured; no extra
      # re-provisioning step is run anymore.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Write HELIUS_API_KEY as a Worker secret so the on-chain volume
      # resolver runs at full speed. Best-effort by design: if the GitHub
      # Actions secret is unset, or the write hits a transient Cloudflare
      # versioning conflict, the worker still runs (graceful fallback to
      # public RPC) — never block a release on it. GitHub forbids referencing
      # secrets in `if:` conditions, hence the shell guard.
      - name: Set HELIUS_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            if echo "$HELIUS_API_KEY" | npx wrangler secret put HELIUS_API_KEY; then
              echo "::notice::HELIUS_API_KEY written to Worker secret"
            else
              echo "::warning::HELIUS_API_KEY secret update failed (see above) — continuing, the worker falls back to public RPC"
            fi
          else
            echo "::warning::HELIUS_API_KEY not set as a GitHub Actions secret — skipping (fallback to public RPC)"
          fi

      # Optional JUPITER_API_KEY (x-api-key header) for higher rate limits on
      # the new developer platform. Keyless works at 0.5 RPS, so this is
      # purely a headroom upgrade — best-effort, never blocks a release.
      # Wired here (not the dashboard) to avoid the un-deployed-version draft
      # trap of dashboard secret edits under Cloudflare versioning.
      - name: Set JUPITER_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          if [ -n "$JUPITER_API_KEY" ]; then
            if echo "$JUPITER_API_KEY" | npx wrangler secret put JUPITER_API_KEY; then
              echo "::notice::JUPITER_API_KEY written to Worker secret"
            else
              echo "::warning::JUPITER_API_KEY secret update failed — continuing keyless (0.5 RPS is fine)"
            fi
          else
            echo "::warning::JUPITER_API_KEY not set as a GitHub Actions secret — skipping (keyless 0.5 RPS is fine)"
          fi

      # Optional COINGECKO_API_KEY (CoinGecko Demo/Pro key, sent as
      # x-cg-demo-api-key / x-cg-pro-api-key) — the ONLY route back to
      # GeckoTerminal's new_pools, whose keyless quota is shared across
      # Cloudflare's whole egress fleet (see docs/gecko-429.md). With the key
      # configured the discovery leg is quota-bound, so it is gated to one
      # fetch per GECKOTERMINAL_DISCOVERY_INTERVAL_SECONDS (wrangler.toml: 5 min
      # = 8,640 calls/month against the demo plan's 10K). Best-effort by
      # design: unset just leaves the leg keyless (`geo 0`) with the launch
      # slot carried by pump.fun + Meteora — never block a release on it.
      - name: Set COINGECKO_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          if [ -n "$COINGECKO_API_KEY" ]; then
            if echo "$COINGECKO_API_KEY" | npx wrangler secret put COINGECKO_API_KEY; then
              echo "::notice::COINGECKO_API_KEY written to Worker secret"
            else
              echo "::warning::COINGECKO_API_KEY secret update failed — continuing keyless (the launch slot is covered by pump.fun + Meteora)"
            fi
          else
            echo "::warning::COINGECKO_API_KEY not set as a GitHub Actions secret — skipping (the gecko discovery leg stays at geo 0)"
          fi

  # AFTER the deploy, so Turso has already stopped taking writes and this pass
  # sees the whole cutover window. It may only INSERT rows D1 lacks (see the
  # header): everything D1 wrote since the switch is newer than anything the
  # archive can still hold. Runs on every deploy — once worker_state.d1_cutover_v1
  # is stamped it is just the count report, which is also the check that D1 is
  # really the store (it fails if a table the bot fills came up empty).
  catchup:
    needs: [migrate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fill anything the cutover window left behind
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ needs.migrate.outputs.database_id }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # The manual "fill the gaps now" button (workflow_dispatch). The
          # script reads it instead of the shell building a flag out of an
          # expression, which is also what keeps the push path free of one.
          FORCE_CATCHUP: ${{ inputs.catchup }}
        run: node scripts/d1-copy.js catchup

