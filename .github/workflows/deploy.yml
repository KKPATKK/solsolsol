name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Offline unit tests (local libsql file: DB — no network, no secrets).
      # Guards the settings schema/migration, the re-eval pool query, the
      # batched token_stats methods and the /filter argument parser.
      - name: Unit tests
        run: npm run test:unit

      # Deploy first: with Cloudflare's versioning model, `wrangler secret put`
      # refuses to bind a secret when the latest Worker version is an
      # un-deployed draft (e.g. a dashboard edit that was saved but not
      # deployed). Deploying first makes the latest version the deployed one,
      # so the secret write below succeeds instead of blocking the release.
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cron Trigger repair + diagnostics: `wrangler deploy` prints "Deployed
      # triggers" even when the schedule silently stops firing (observed
      # 2026-08-14: the worker's persisted tick counter stayed null for hours
      # while HTTP-driven scans ran fine — scheduled events never arrived even
      # after PUT-over-same re-provision). A DELETE + recreate is the API
      # equivalent of toggling the trigger in the dashboard, which is the
      # standard remedy for silent cron-delivery failures.
      - name: Re-provision cron schedule
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/solana-meme-bot"
          echo "::group::DELETE schedule"
          curl -sS -X DELETE -H "$AUTH" "$API/schedules" | tee /tmp/sched_del.json
          echo
          echo "::endgroup::"
          grep -q '"success": true' /tmp/sched_del.json && echo "::notice::Cron schedule deleted" || echo "::error::Cron schedule DELETE failed"
          echo "::group::PUT schedule (recreate)"
          curl -sS -X PUT -H "$AUTH" -H "Content-Type: application/json" \
            -d '[{"cron":"* * * * *"}]' "$API/schedules" | tee /tmp/sched_put.json
          echo
          echo "::endgroup::"
          grep -q '"success": true' /tmp/sched_put.json && echo "::notice::Cron schedule recreated" || echo "::error::Cron schedule PUT failed"
          echo "::group::Verify schedule"
          curl -sS -H "$AUTH" "$API/schedules" | tee /tmp/sched.json
          echo
          echo "::endgroup::"
          grep -q '\* \* \* \* \*' /tmp/sched.json && echo "::notice::Cron schedule * * * * * verified bound" || echo "::error::Cron schedule not found after recreate"
          echo "::group::Deployments"
          curl -sS -H "$AUTH" "$API/deployments" | head -c 4000
          echo
          echo "::endgroup::"

      # Write HELIUS_API_KEY as a Worker secret so the on-chain volume
      # resolver runs at full speed. Best-effort by design: if the GitHub
      # Actions secret is unset, or the write hits a transient Cloudflare
      # versioning conflict, the worker still runs (graceful fallback to
      # public RPC) — never block a release on it. GitHub forbids referencing
      # secrets in `if:` conditions, hence the shell guard.
      - name: Set HELIUS_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            if echo "$HELIUS_API_KEY" | npx wrangler secret put HELIUS_API_KEY; then
              echo "::notice::HELIUS_API_KEY written to Worker secret"
            else
              echo "::warning::HELIUS_API_KEY secret update failed (see above) — continuing, the worker falls back to public RPC"
            fi
          else
            echo "::warning::HELIUS_API_KEY not set as a GitHub Actions secret — skipping (fallback to public RPC)"
          fi

      # Optional JUPITER_API_KEY (x-api-key header) for higher rate limits on
      # the new developer platform. Keyless works at 0.5 RPS, so this is
      # purely a headroom upgrade — best-effort, never blocks a release.
      # Wired here (not the dashboard) to avoid the un-deployed-version draft
      # trap of dashboard secret edits under Cloudflare versioning.
      - name: Set JUPITER_API_KEY worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          if [ -n "$JUPITER_API_KEY" ]; then
            if echo "$JUPITER_API_KEY" | npx wrangler secret put JUPITER_API_KEY; then
              echo "::notice::JUPITER_API_KEY written to Worker secret"
            else
              echo "::warning::JUPITER_API_KEY secret update failed (see above) — continuing keyless (0.5 RPS)"
            fi
          else
            echo "::warning::JUPITER_API_KEY not set as a GitHub Actions secret — skipping (keyless 0.5 RPS is fine)"
          fi
