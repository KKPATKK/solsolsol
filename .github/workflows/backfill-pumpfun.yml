name: Backfill pump.fun coins

# Runs the one-time backfill (seed token_stats with pump.fun coins created in
# the last ~42h) from a GitHub Actions runner. pump.fun blocks datacenter IPs
# (530 from the sandbox and the Cloudflare Worker), but GitHub-hosted runners
# egress from different ranges — this job tests reachability first and only
# runs the backfill when the feed responds.
#
# WHERE IT WRITES (2026-10-15): D1, not Turso. The cutover made Turso a
# read-only archive (docs/d1-migration-2026-10-15.md), so rows written there
# would never reach the Worker's pool — the script now names the D1 database
# itself (resolve it below) and writes through the Cloudflare API. The Turso
# secrets are no longer needed by this job.
#
# Trigger: manual (Actions tab → Run workflow), or automatically when the
# backfill script changes. Needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# as GitHub Actions secrets (the token needs D1:Edit).

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/backfill-pumpfun.mjs'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The script chunks its INSERTs with the shared helper from src/d1.ts
      # (chunkForParamLimit) and talks to D1 through scripts/d1-rest.js.
      - name: Build
        run: npm run build

      # The database's uuid, looked up (or created) by name — never committed.
      - name: Resolve the D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: solana-meme-bot
        run: node scripts/d1-copy.js ensure

      - name: Test pump.fun reachability from runner
        run: |
          code=$(curl -s -o /tmp/pf.json -w "%{http_code}" --max-time 15 \
            "https://frontend-api.pump.fun/coins?limit=2&sort=created&order=DESC")
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "::notice::pump.fun reachable from GitHub Actions runner — backfill can run here"
            echo "REACHABLE=1" >> "$GITHUB_ENV"
          else
            echo "::warning::pump.fun returns $code from GitHub Actions runner (datacenter block) — backfill cannot run here; see docs for alternatives"
          fi

      - name: Run backfill
        if: env.REACHABLE == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::warning::the D1 database could not be resolved (is CLOUDFLARE_API_TOKEN set, with D1:Edit?) — refusing to write the Turso archive instead; re-run once the secret is in place"
            exit 0
          fi
          node scripts/backfill-pumpfun.mjs --since-hours 42
