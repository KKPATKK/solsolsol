name: "Backfill the re-eval pool (was: pump.fun coins)"

# WHY THE FILE IS STILL CALLED backfill-pumpfun.yml. This is the same operator
# lever it always was — the one-shot that seeds token_stats with recently
# created coins, so launches that happened before discovery was watching can
# still age into the re-eval pool and be pushed — but its SOURCE is retired
# (2026-10-15). The path stays because docs/d1-migration-2026-10-15.md, the
# deploy workflow's notes and the run history all link to it by path; the name
# above says what it now does.
#
# WHAT CHANGED, AND WHY A GREEN RUN IS NO LONGER ENOUGH. The old job scraped
# pump.fun's launch API from the runner and gated on its reachability. Measured
# 2026-10-15, that feed refuses every egress this bot has: the sandbox and the
# GitHub-hosted runner both get a Cloudflare challenge page from
# `frontend-api.pump.fun` (HTTP 403, "Just a moment…"), `frontend-api-v2`
# answers `access_denied / rule_id 0.18`, and the legacy host is dead outright
# (530 / error 1016 — see src/pumpfun.ts). So the gate SKIPPED the backfill
# while the job still reported success (run 38725742725's log reads "pump.fun
# returns 403 from GitHub Actions runner — backfill cannot run here"): a job
# that seeds nothing looked exactly like a job that seeded everything.
#
# THE SOURCE NOW. Birdeye's `new_listing` feed with meme_platform_enabled=true
# (pump.fun launches included), reached the way production already reaches it —
# the deployed Worker calls it and writes the rows through its own D1 binding
# (src/worker.ts `/debug/backfill`; scanner.runPeriodicBackfill is the same call
# on an interval inside the tick). This job is the manual lever on that route:
# the difference between "seeded now" and "seeded when the interval next fires".
#
# NO CREDENTIALS. The route is unauthenticated and the write happens inside the
# Worker, so this workflow holds NO secret at all: nothing to rotate, nothing to
# leak, and no CLOUDFLARE_API_TOKEN with D1:Edit for a backfill that no longer
# writes from the runner. `scripts/backfill-pool.mjs` is what makes the run
# honest — it exits non-zero when the route refuses and reads the route's own
# sample mint back through `/debug/token`, so a run that seeded nothing cannot
# pass (see its header). It also reads the Worker's hostname from wrangler.toml
# rather than repeating it here.
#
# TRIGGER: manual only. The route WRITES production D1 (idempotently), so the
# `push:` trigger the old file carried — on the script's own path — would seed
# the pool as a side effect of a commit. Dispatch it from the Actions tab, or
# with `gh workflow run backfill-pumpfun.yml`.
#
# It needs no D1 credentials and no database id for exactly that reason, which
# is why scripts/test-d1-migrate.js asserts the absence of BOTH here (the
# Axiom refresher, which still writes D1 from the runner, keeps resolving the
# database by name).

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Worker base URL — leave empty to use wrangler.toml's CRON_RELAY_URL"
        required: false
        default: ""
      timeout_ms:
        description: "How long to wait for the route (it walks a 42h window in 6h chunks)"
        required: false
        default: "120000"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node is pinned like every other workflow here, but nothing is installed
      # and nothing is built: the script is standalone (global fetch + node:fs)
      # and the write happens inside the Worker, not in this runner — which is
      # also why this job needs no `npm ci`, no `npm run build` and no cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Seed the pool through the deployed Worker
        env:
          WORKER_URL: ${{ inputs.worker_url }}
          TIMEOUT_MS: ${{ inputs.timeout_ms }}
        run: node scripts/backfill-pool.mjs
