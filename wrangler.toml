name = "solana-meme-bot"
main = "src/worker.ts"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

# Both expressions fire every minute (the free-tier minimum), and each one is
# a SEPARATE invocation with its own 50-subrequest budget — which is the
# whole point of the second string (2026-09-27):
#
#   "* * * * *"     the scan tick, exactly as before.
#   "*/1 * * * *"   the tracker pass's OWN invocation (worker.TRACKER_CRON).
#
# WHY THE SPLIT (live 2026-09-27 01:31-01:57Z, after the claim+reservation
# merge): the pass is the LAST stage of the scan tick, so it spends what the
# tick has left of Workers Free's 50 subrequests — and the tick's own front
# reads 18-39 of them BEFORE the pass is offered one (`heartbeat.subreqs`,
# `tickProgress.postscan`). Measured: `postscan subreqs 39` with the pass then
# reading `ok:0/0 deferred:subreq-budget trips 0` (its entry gate, no row
# touched), and passes carrying `defer-send 6 subreq-cut 6` — every alerting
# row refused at TRACKER_SUBREQ_RESERVE while the fast-DB and slow-DB passes
# refused exactly the same count. One card path is 4-5 subrequests, so a
# residual claimant holding single digits delivers 0-1 cards a minute however
# cheap a card gets. In its own invocation the pass pays only init + its own
# work, and the scan tick stops lending it anything.
#
# `event.cron` must match these strings CHARACTER FOR CHARACTER (see
# Cloudflare's scheduled-handler docs), which is why worker.isTrackerCron
# compares exactly and scripts/test-unit.js pins the pair against this file.
#
# SAFETY: if this second expression ever stops being delivered — the platform
# has done that to this Worker before (see docs/uptime-monitor.md) — the scan
# tick runs the pass itself again as a FALLBACK the moment the durable pass row
# is older than worker.TRACKER_PASS_FALLBACK_FRESH_MS, so a dead trigger costs
# the pass cadence, never the cards.
#
# The scan itself is still gated by SCAN_INTERVAL_SECONDS below (60s → every
# tick runs a scan, the fastest cadence the 1-min cron can drive). If the
# upstream API pressure (GeckoTerminal 429s) ever returns, raise this back to
# 90 (every other tick) — the re-eval pool + Birdeye backfill keep coverage
# during the gap.
#
# "*/5 * * * *"  the MAINTENANCE delivery's OWN invocation (worker.
#                MAINTENANCE_CRON, 2026-09-29): the interval-gated,
#                side-effect-only legs — the Birdeye periodic backfill and the
#                crime-wallet list refresh — which used to run inside the scan
#                tick's front phase.
#
# WHY THE SPLIT (measured 2026-09-29): the account is on Workers Paid now
# (subrequest budget 1000, live `heartbeat.subreqs` = 38 used), so neither leg
# was being DROPPED any more — they were being PAID FOR in the wrong place.
# The backfill walks up to ~4 six-hour Birdeye chunks on the hour it is due and
# then writes a batch of token rows, all inside the front phase the pair fetch
# and the gates share; the crime refresh downloads ~4.8K addresses on the first
# tick after a recycle (it used to be `crime-refresh` in the old subreqSkip
# list for the same reason). Neither result is read by the invocation that
# produces it — the backfill seeds token_stats, the crime list persists for the
# fleet to hydrate — so the only change is WHICH invocation pays their wall
# clock, and it is now the one whose latency nobody waits on.
#
# The GeckoTerminal discovery leg deliberately does NOT move: its pools are the
# tick's candidate list for that minute, not a side effect, so moving the fetch
# would need a durable feed channel the tick reads — a separate change with its
# own measurement.
#
# SAFETY: a missed delivery costs freshness, never a leg. The scan tick runs
# both legs itself whenever scanner.MAINTENANCE_PASS_STATE_KEY is older than
# scanner.MAINTENANCE_PASS_FALLBACK_FRESH_MS (11 minutes = two cron periods
# plus jitter, the same arithmetic the pass's fallback uses), and the leg's own
# interval gate still decides whether it actually does anything.
[triggers]
crons = ["* * * * *", "*/1 * * * *", "*/5 * * * *"]

# Non-secret tuning knobs. Secrets (TELEGRAM_BOT_TOKEN, TURSO_DATABASE_URL,
# TURSO_AUTH_TOKEN, BIRDEYE_API_KEY, HELIUS_API_KEY, COINGECKO_API_KEY) must NOT
# live here — set them in the Cloudflare dashboard (Workers > solana-meme-bot >
# Settings > Variables and Secrets) or via `wrangler secret put <NAME>`.
# COINGECKO_API_KEY (with COINGECKO_API_PLAN=demo|pro) moves the
# GeckoTerminal/CoinGecko rate limit from the shared Worker egress IP onto the
# key — see docs/gecko-429.md. Measured 2026-09-25: keyless is ~5 req/min per
# source IP and the Worker's shared IP never gets them, so the key is the ONLY
# route back to gecko. It is quota-bound, not rate-bound: the demo plan is
# 100 calls/min + 10K calls/month, and this bot's new_pools leg alone at one
# call per tick is ~43K/month, so a key only pays off with the discovery leg
# throttled to one call per ~5 min (8,640/month). Trending stays off below.
#
# 2026-09-28: a key is CONFIGURED, so this is the live path rather than an
# option. The throttling it needs is now enforced in code —
# GECKOTERMINAL_DISCOVERY_INTERVAL_SECONDS below — and the launch slot is
# carried between gecko fetches by pump.fun (always on) and Meteora. The key is
# a Worker SECRET: the deploy workflow writes it from the GitHub Actions secret
# COINGECKO_API_KEY (see .github/workflows/deploy.yml), which is also the only
# place it should ever be typed. A keyless deploy still runs — the leg simply
# stays at `geo 0` (summary.geoDue is still true; it is the fetch that comes
# back refused) and the two keyless sources carry the slot.
[vars]
# Minimum gap between scans, in seconds. The cron trigger still fires every
# minute, but the worker skips the scan when the previous one COMPLETED less
# than `scanGateMs(this)` ago — this value minus a jitter budget, cross-isolate
# via the DB heartbeat (src/worker.ts). The budget is 30s at 60s and shrinks to
# whatever room stays above one cron period for longer intervals, which is what
# keeps 90 skipping every other tick instead of silently becoming 60. The
# monitor-driven HTTP fallback is a pure RESCUE since 2026-09-27: it needs
# max(120s, 2 x this) of silence before it scans at all, so a tick that is
# merely late still scans for itself. 60 = scan every
# minute — the fastest cadence the 1-min cron can drive: hot-zone push
# latency for coins that qualify inside the age window is ~1 min. 90 = scan
# every ~2 min, halving GeckoTerminal / DexScreener / Birdeye call volume
# and Turso rows-read (the 2026-08-16 mitigation for the sustained gecko
# 429s — restore it if those return; the gecko client's 5-min backoff and
# the Birdeye backfill are the safety nets at the 60s cadence).
SCAN_INTERVAL_SECONDS = "60"
# Max coverage: inspect the newest 200 Solana token profiles per scan
# (the code caps this at 200). Deferred candidates stay in the re-eval
# pool, so nothing is lost when a tick runs out of budget.
#
# 2026-09-28: 100 → 200 on the Workers Paid plan (see worker.SCAN_TICK_BUDGET_MS).
# This is HEADROOM, not a live lever, and the note is honest about it: the
# /token-profiles/latest/v1 page carries ~20–30 Solana rows per tick (live
# `summary.profiles` read 19–23 all week), so the slice never bound at 100
# and will not bind at 200. What actually bounds coins-per-tick is the re-eval
# rotation slice (scanner.RE_EVAL_PER_TICK_MAX, 90 → 180) together with the
# pair fetch that feeds it (dexscreener.PAIRS_FETCH_BUDGET_MS, 1_000 → 2_000).
SCAN_PROFILE_LIMIT = "200"
# DexScreener /token-boosts/latest/v1 feed size per scan (code default 0 =
# disabled, max 30 — the upstream list is 30 rows).
# The newest PAID promotion slots: measured 2026-09-25 from the sandbox and
# from the Worker's own egress, 200 with 30 rows of which 19 are Solana, and
# ZERO overlap with the 16 Solana mints /token-profiles/latest/v1 returned in
# the same minute ⇒ +19 net-new mints per tick for one extra subrequest plus
# one pair batch, on the SAME host as the profiles feed (so it shares that
# rate-limit bucket instead of opening a new one). Rows carry no metrics and
# no timestamps, so the age comes from the pair the next batch fetches.
# The leg is OPTIONAL (dropOptionalLeg("boosts") in scanner.ts) and the
# dedupe is total — a boost mint already carried by dex/pump/gecko/geoTrend
# is dropped, and jup/jupTrend/meteora now skip boost mints too.
# STARTS AT 20 (2026-09-25): the tick races the scan against a ~5s window
# (9,500ms tick budget − 4,500ms flush reserve) and the scan's own feed
# deadline is 4.2s against a p50 scan of 2,627ms — the extra pair batch is
# ~0.5s, which fits, and the leg is the first thing dropOptionalLeg("boosts")
# gives up when it does not. Watch /health heartbeat.summary.boosts together
# with scanMs and subreqSkip; set this back to "0" if scanMs climbs or the leg
# starts appearing in subreqSkip.
DEXSCREENER_BOOSTS_LIMIT = "30"
# Re-evaluation pool: never-pushed coins nearing/inside the qualifying age
# window that the bot keeps tracking until they qualify (code default 40,
# max 1200). Ordered by relevance, so the closest-to-qualifying coins are
# always checked first; leftovers simply defer to the next tick.
# 1000 → 1200 (2026-09-29): the HOT band had outgrown its own LIMIT — measured
# 607 rows read against a 300-row cap, which clipped 82 of the 268 ELIGIBLE
# rows (ages 99-110min) on every scan, so the hot zone was not in fact
# "evaluated every scan". The band's warm side was halved to 30 min and its
# budget raised to 460 so nothing is clipped; 460 + 490 near + 210 far = 1200.
# This is a budget SPLIT, not extra work per tick: the same rotation slice is
# still what gets evaluated.
RE_EVAL_POOL_SIZE = "1200"
# Graduated re-eval pool rotation (see src/db.ts): everything older than the
# hot zone (window entry ± margin, evaluated EVERY scan) is swept in two
# tiers. NEAR tier = the first 6h inside the age window — the coins most
# likely to cross the gates after entering — swept every REEVAL_NEAR_SWEEP_MIN
# (code default 6). FAR tier = the older tail, swept every
# REEVAL_FAR_SWEEP_MIN (code default 18) — every coin is still re-checked at
# least once per sweep, but the old tail stops consuming most of the budget.
# Rotation bands order by the highest mcap ever observed, and coins
# repeatedly seen below half the market-cap gate are dropped from the pool
# (pre-qualification filter), so the sweep budget concentrates on realistic
# candidates. Slots = sweep ÷ the pool cache TTL below (capped at 12 near
# and 48 far by src/config.ts; 3/1.5 = 2 and 18/1.5 = 12 slots here).
#
# SIZING THE BANDS (2026-09-15 audit, measured against /debug/pool): a band's
# per-visit LIMIT is a hard cap and bands are read in signal order (max mcap
# first), so a sub-window holding MORE than its LIMIT is truncated to the
# same signal-ordered head on every visit — the rest of that sub-window is
# never read, however often its slot comes around. The live probe showed the
# far band pinned exactly at its 210-row limit (12–24h: 111 + 24–43h: 99)
# while the near band came back at 413 of its 490, i.e. the FAR zone starves
# and the NEAR zone does not. 12 far slots narrow each sub-window to ~1.6h
# (~105 prune-passing coins, comfortably under 210) so the far sweep covers
# its zone instead of re-reading a head; a full far sweep is 18 min. NEAR
# stays at 2 slots (~3 min) because its zone already fits. Both must stay
# multiples of the pool cache TTL.
#
# 2026-09-29 — SIZING ALONE STOPPED BEING ENOUGH: the pool grew until the
# sub-windows were over their LIMIT again (worst far sub-window 400 rows vs
# 210; worst near 602 vs 490), so the starvation the 09-15 audit fixed was
# back. Re-sizing every time growth catches up is a treadmill, and the same
# measurement showed why it never needs to be: the 190 overflow rows of that
# far sub-window sat in ONE tie group — 256 rows carrying the identical signal
# key (no mcap peak, zero first_m5_vol), of which the LIMIT could take 66. The
# bands now resolve those ties with a rotating bucket (src/db.ts
# POOL_BAND_ROTATE_BUCKETS / poolBandOrder), so the overflow is served over
# successive sweeps instead of never, and the slot counts below are a cadence
# choice again rather than a starvation lever.
REEVAL_NEAR_SWEEP_MIN = "3"
REEVAL_FAR_SWEEP_MIN = "18"
# Re-eval pool query cache TTL + rotation period, in seconds. The pool query
# is the scan's dominant Turso rows-read consumer; it re-runs once per TTL
# per isolate, and each expiry advances the rotation slot (slots = sweep ÷
# TTL, so this value MUST stay aligned with the sweep vars above). 90s =
# 1.5-min cache: sweeps at 3/18 min, hot-zone membership refreshed every
# 1.5 min, pool-query rows-read ≈ ×2 the 180s cadence — still a small
# share of the Turso free tier's 500M rows-read/month (see /debug/pool for
# live signals). NOTE: cron frequency is hard-capped at 1 scan/min (Cloudflare
# cron triggers are 5-field only, no seconds), so re-check rate is raised via
# sweep/TTL alignment, not more ticks. Raise TTL (e.g. 300) to cut rows-read
# back.
REEVAL_POOL_CACHE_SECONDS = "90"
# pump.fun discovery as an ALWAYS-ON feed: ENABLED at 20 (2026-09-28).
#
# History: the legacy host (frontend-api.pump.fun) 530-blocks Worker egress
# (CF error 1016, origin DNS gone since ~2026-08-20), so the feed sat at 0 and
# the v3 host (frontend-api-v3.pump.fun) was wired as gecko's FALLBACK instead
# of an always-on feed. The chain flipped the day gecko got a key (see
# COINGECKO_API_KEY above): gecko's new_pools became a QUOTA-BOUND 5-minute leg
# (GECKOTERMINAL_DISCOVERY_INTERVAL_SECONDS below), and the per-tick freshness
# the launch slot actually wants is pump.fun's — ~2s old at offset 0, measured
# from the WORKER's own egress: `pumpfun-v3 status 200 bytes 39112 count 20
# newestAgeS 2`. The two no longer gate each other: pump.fun fetches its batch
# on EVERY tick and Meteora covers the ticks gecko's cadence skips.
#
# Cost: one paginated batch (20 coins = 1 request) per tick on the host that
# already serves this feed. 0 = the leg is off again; an UNSET variable keeps
# the historic 100-coin default.
PUMPFUN_PROFILE_LIMIT = "20"
# GECKO FALLBACK size — LEGACY as of 2026-09-28, and set to 0 because the
# ALWAYS-ON limit above now covers every tick. It is the "fill gecko's slot"
# branch of pump.fun's feed: a batch size, not a switch (0 = off), paid only on
# a tick where gecko delivered nothing — see pumpfunDiscoveryLimit, which only
# reaches this value while PUMPFUN_PROFILE_LIMIT is 0. With the always-on limit
# at 20 that branch is unreachable, so the old chain (gecko → pump.fun →
# Meteora) is gone: the slot is filled by pump.fun on every tick and by Meteora
# on the ticks gecko's 5-minute cadence skips. Leave this at 0 unless the
# always-on feed is deliberately turned off again.
PUMPFUN_FALLBACK_LIMIT = "0"
# Meteora Data API newest-pools feed — GECKO'S COVER (2026-09-28), the
# launch slot's second keyless DEX-side source. It is now reached on every tick
# gecko delivered nothing: the four in five that
# GECKOTERMINAL_DISCOVERY_INTERVAL_SECONDS holds gecko back, plus a due tick
# whose fetch came back empty or refused. 0 = off. ENABLED at 20 after
# /debug/pool-source proved it from the WORKER's own egress on 2026-09-21:
# `meteora-damm-v2 status 200 count 10 newestAgeS 32` with
# `sort_by=pool_created_at:desc` and both pool sides on every row.
# A DIFFERENT provider, not a second URL for pump.fun — which is the point:
# pump.fun covers pump.fun launches and blocks datacenter IPs on and off, this
# covers the other DEXes. Earlier notes said "Meteora cannot serve a
# time-ordered pool list at all"; that was measured against
# `dlmm-api.meteora.ag`, which now 404s every path root-included. Meteora's
# current hosts (dlmm.datapi.meteora.ag / damm-v2.datapi.meteora.ag) do sort by
# creation time. Raydium and Orca still cannot — Raydium's `sortField` enum is
# liquidity/volume/fee/apr (and the look-alike `poolSortField` is silently
# ignored), Orca's pools carry no creation field. One request when reached.
# See src/meteora.ts.
METEORA_FALLBACK_LIMIT = "20"
# Minimum spacing between GeckoTerminal new-pools FETCHES, in seconds (code
# default 300 = one fetch per 5 min; 0 = no gate, one per tick). This is the
# cadence the KEYED leg is spent at: the demo plan is 10K calls/month, one call
# per 5 minutes is 8,640/month, and the discovery loss is nil because a launch
# pool is only judged once it ages into the 30h qualifying window. 0 would be
# ~43K/month and would burn the key in a week.
#
# The gate is DURABLE (worker_state `gecko_discovery_at`, riding the scan
# front's single read + single write), because this Worker's isolates churn
# every ~30s: a per-isolate window would never elapse and the quota arithmetic
# above would not hold. On a tick the gate skips, `summary.geoDue` is false
# and Meteora fills the slot (see the launch-slot chain in src/scanner.ts).
#
# 2026-09-28 (B1): the gate is charged at DISPATCH, and a fetch that comes back
# REFUSED re-arms it to the moment the client's own 429 pause is over
# (scanner.geckoDiscoveryRetryStamp + GeckoTerminalClient.pauseEndsAt), never
# past the interval. A transient 429 therefore costs the feed its PAUSE rather
# than a whole window: 60s on the keyed ladder instead of 5 minutes, while a
# keyless feed (whose pause IS the interval, and escalates past it) keeps
# exactly the cadence it had. `summary.geoRetryAt` is the reading that proves a
# retry was scheduled, and `summary.gecko.http429` is where it came from.
GECKOTERMINAL_DISCOVERY_INTERVAL_SECONDS = "300"
# GeckoTerminal trending-pools feed size per scan (code default 20 when unset;
# 0 = the leg is off — scanner.ts only builds it while this is > 0).
# DISABLED (2026-09-25): the keyless quota is ~5 requests/minute PER SOURCE IP
# with a 60s window — measured from a clean host (5x200 then 429, full again 68s
# later) — and a Cloudflare Worker's egress IP is shared fleet-wide, so the
# bucket is gone within seconds. The client can then only READ the edge cache,
# never fill it: live /health.gecko read `ok == cacheHits` (4/4, then 8/8) with
# zero successful origin requests, because 429s are deliberately not cached and
# upstream s-maxage is 60. So this leg paid 1 doomed request + 1 gecko throttle
# slot per tick for a `geoTrend 0` reading. Momentum coverage is already carried
# by JUPITER_TRENDING_LIMIT (one request, keyless, no shared-IP 429).
# Restore a positive value only together with COINGECKO_API_KEY (demo plan: quota
# per key — 100 calls/min + 10K/month). See docs/gecko-429.md.
GECKOTERMINAL_TRENDING_LIMIT = "0"
# GMGN trending discovery feed size per scan (code default 30 when unset).
# DISABLED (2026-09-24): GMGN's edge 429s a Cloudflare Worker's shared egress
# IP at the IP level, so the leg can never deliver a coin — live /health
# .gmgnFeed read `requests 9 / http429 9 / consecutive429 9 / lastStatus 429`
# with `gmgn 0` on every scan, and /debug/gmgn answered `ok true, count 0`.
# It is not a per-tick cost (the client self-pauses 5 min after each 429 —
# see GMGN_RATE_LIMIT_BACKOFF_MS), but one doomed request per 5-min window
# plus the per-candidate /token/info probe sharing that backoff is still
# pure waste.
# 0 = the leg is off. Restore a positive value only after /debug/gmgn proves
# the block is gone. This switch does NOT cover the candidate-enrichment path
# (smart-money count / wash-trading flag, and with it the
# GMGN_BLOCK_WASH_TRADING gate) — see GMGN_ENABLED below, which removes the
# whole client.
GMGN_TRENDING_LIMIT = "0"
# Global GMGN kill switch (default on; mirrors ARKHAM_ENABLED). 0 = the Worker
# never constructs the GMGN client (src/worker.ts builds it only when
# GMGN_API_KEY is set AND this is not "0"/"false"), so every GMGN call goes
# away in one move: the discovery feed above, the per-candidate /token/info
# that fed the card's smart-money line, and with it the
# GMGN_BLOCK_WASH_TRADING gate (inert either way — the lookup it reads has
# never succeeded from this egress, so it could not fire).
# TAKEN (2026-09-30): the 2026-09-24 block never cleared. It is the shared
# egress IP that GMGN 429s, not the key, so no retry/backoff tuning can clear
# it — the client only ever spent requests that could not land (~1 per 5-min
# backoff window, plus the per-candidate probes sharing that backoff).
# Live /health now reads `gmgnConfigured true` with `gmgn 0`; after this it
# reads `gmgnConfigured false`.
# TRADE-OFF: an absent client means /debug/gmgn can only report
# `GMGN not configured` — it can no longer make the probe request. The
# acceptance path is kept but now costs one flip: set this back to "1" (plus
# GMGN_TRENDING_LIMIT) to re-arm the probe, and keep it only once the feed
# delivers items again.
GMGN_ENABLED = "0"
# Crime-wallet blocklist (community list — see src/crimewallets.ts).
# DISABLED (2026-09-24): the gate it feeds is display-only
# (CRIME_WALLETS_BLOCK=false) and, live, never judges — /debug/crime-wallets
# answered `size 0, loadedAt null, loadedFrom null` while the client still
# cost the cold-isolate hydrate (two worker_state reads of the ~216KB list on
# the isolates that recycle every tick) plus, whenever a copy did land, two
# Helius RPC calls per candidate (getTokenLargestAccounts + getMultipleAccounts).
# 0 = the client is never built: no list fetch/hydrate, no holder RPC, no
# crime flag on the card. The scanner already fail-opens with an empty result
# when `crimeWallets` is null (see scanner.ts's `crimeClient ? … : null`), and
# the wallet analysis it fed resolves to the creator-only path — the same
# shape the live worker showed while the list was not loading, so this is
# behaviour-neutral for pushes. Restore "true" (and set CRIME_WALLETS_BLOCK)
# only after /debug/crime-wallets proves the list loads AND you want the flag.
CRIME_WALLETS_ENABLED = "false"
# 2026-09-08: halved from 1000 — Jupiter-recent pacing (20 coins × interval)
# was consuming ~5s of the 5.5s feed cap every tick, so feedsMs+evalMs+overhead
# blew the 11s tick budget on ~2/3 of ticks (timeout rows in scan-history).
# Coverage unchanged: the feed cap still bounds the phase, it just fits more
# coins inside it before the cap trips.
JUPITER_REQUEST_INTERVAL_MS = "500"
# Jupiter Token v2 trending feed size per scan. 2026-09-21: 15 → 100. The page
# is ranked by 24h organic score, so its HEAD is blue chips and blue chips never
# qualify: measured with the live window ($60K–$230K / 80min–26h) exactly 0 of
# the top 15 entries fitted, 8 of the top 100 did (Lobby 26h/$202K, TYLER
# 17.6h/$81K, INU 12h/$181K…). The leg is one subrequest either way, and the
# band filter runs at parse time, so the extra entries never reach the pair
# phase (see jupfeeds.parseJupTrendTokens + docs/profiles-feed-zeros.md).
# 0 = the leg is off entirely.
JUPITER_TRENDING_LIMIT = "100"
# DexScreener dispatch spacing, ms (code default 350). 2026-09-15: 350 → 250.
# The pair phase is a fixed 1.5s window (PAIRS_FETCH_BUDGET_MS) and the shared
# throttle spaces every request START, so the window held 5 dispatch slots at
# 350ms and holds 6 at 250ms — one more 30-address batch per tick, i.e. ~30
# more coins actually fetched/evaluated per scan for the same wall clock and
# the same Turso rows read (the slice was raised to 160 to match).
#
# 2026-09-28 (Workers Paid): the pair window is PAIRS_FETCH_BUDGET_MS 2,000
# now, not 1,000, and the reason is measured rather than theoretical. The
# request is ~112 addresses (the 90-coin rotation slice plus the feed's ~22)
# = 4 batches of 30, and at this spacing the fourth batch cannot START before
# ~750ms and then has to answer — which is why the live `pairs` reading was
# 83 of ~112 while the phase rode its 1,000ms cap. 2,000 gives the phase 8
# slots (240 addresses) so the request is fetched WHOLE, and it doubles as
# headroom for the tracker head and for any future slice raise (the 180-coin
# slice was tried on 2026-09-28 and reverted — see scanner.
# RE_EVAL_PER_TICK_MAX). The 2026-09-19 cut to 1,000 existed to hand the free
# plan's 3550ms claim gate its time; the chain deadline is 6_500ms now. This is the
# shared egress IP's rate limit, so it is measured, not assumed: /health →
# heartbeat.dex reports intervalMs / http429 / blockedForMs per tick, and the
# heartbeat's dex429Total plus the Turso row behind db.bumpDex429 count every
# rate-limit episode fleet-wide.
#
# 2026-09-18: tried 350 for ten minutes and put it back to 250 — the spacing
# is NOT what the endpoint is limiting. Measured at 350ms on a single isolate
# (02:50–03:00Z): http429 went 0 → 8 with the 90s cache-only backoff
# re-arming (blockedForMs ~30s on four separate ticks) — the same shape the
# 250ms setting showed ({intervalMs: 250, http429: 14, blockedForMs: 32200}),
# so the extra 100ms bought nothing while costing one 30-address batch per
# tick. The limiter is the request PATTERN (3 concurrent batches per pair
# phase on one shared egress IP, plus the profiles feed), not the dispatch
# spacing. Coverage is protected where it matters instead: the pair phase
# falls back to Jupiter's token API whenever DexScreener returns under half
# the addresses, and that fallback carried 130/130 pairs through the whole
# 429 window. One hit still arms the same 90s backoff
# (PAIR_BATCH_BACKOFF_MS), so the failure mode stays "lost coverage for a
# minute", never a hammering loop. Watch http429/blockedForMs here: they are
# the signal for the CONCURRENCY (PAIR_BATCH_CONCURRENCY), not this value.
DEX_REQUEST_INTERVAL_MS = "250"
# ADAPTIVE SPACING (2026-09-29) — this value is now the BASE, not the rate.
# Two layers raise it on a counted 429 and walk it back down on a healthy
# streak, and neither can ever take it BELOW this number:
#
#   dexscreener.AdaptiveSpacing        per isolate. x1.6 per refusal up to
#                                      DEX_ADAPTIVE_MAX_MS (1200), one step back
#                                      per 6 consecutive 2xx. Reacts within the
#                                      refused request, dies with the isolate.
#   worker_state "dex_spacing"         the FLEET row. {at, steps}; the next
#                                      tick adopts it, decaying one step per
#                                      DEX_ADAPTIVE_FLEET_DECAY_MS (60s = one
#                                      tick) of quiet. Raise-only on adoption.
#
# WHY THE ROW EXISTS (measured 2026-09-29T00:57Z): the per-isolate layer alone
# lost its raise at the moment it mattered — the refused isolate read
# intervalMs 1024 / spacingSteps 3 while the tick two minutes later, a different
# isolate, read 250 / 0 and walked into the same burst at full rate. Isolates
# churn every ~30s, so a per-isolate 429 reaction is mostly a per-isolate
# memory. The row rides the scan front's ONE read and ONE write
# (db.SCAN_FRONT_GATE_KEYS) and is written ONLY on a tick whose step count
# moved, so a healthy fleet pays nothing for it.
#
# READ IT FROM /health or /debug/tick: heartbeat.dex now carries intervalMs
# (live), configuredIntervalMs (this value), spacingSteps (this isolate) and
# spacingFleetSteps / spacingFleetAgeMs (the row, after decay).
# spacingFleetSteps > 0 is the proof that a raise outlived an isolate, which is
# the only thing this change can claim.
#
# SIZING THE DECAY (measured 2026-09-29T01:24-01:26Z): the first cut of the
# window was 15s, sized against the in-isolate walk-back (6 consecutive 2xx =
# 1.5s of dispatch at the base), and it was inert — the scan is what reads the
# row and it runs once a minute, so the row was written at 01:24:32 (a real 429
# at 01:24:30) and read `spacingFleetSteps 0` at 01:25:04. A memory shorter than
# the cadence of its only reader is not a memory; the unit is therefore one
# TICK. A test pins DEX_ADAPTIVE_FLEET_DECAY_MS >= SCAN_INTERVAL_SECONDS so the
# two cannot drift apart silently again.
# Supply-flow (rug/distribution) check — OFF as of 2026-09-26.
#
# WHY: the check's only product was ONE card line (on the legacy enrichment
# group), and with AXIOM_ENABLED = "0" (2026-09-19) the Axiom summary no
# longer replaces that group — so every card carried the line again. The
# operator does not want it, and the check was the card's most expensive
# part: a Helius analysis (~10 RPC calls — getTokenLargestAccounts +
# gTFA out-transfers, budget-guarded to the SUPPLY_FLOW_BUDGET_MS below)
# plus one token_stats write per analyzed coin, re-run per coin every
# SUPPLY_FLOW_REFRESH_MIN. With "false" the scanner's resolveSupplyFlow
# returns "unknown" BEFORE any RPC, budget arithmetic or write, and the
# call site hands renderMessage null, which HIDES the line — an idle
# "未分析" line on every push is exactly what this removes.
#
# TRADE-OFF, stated plainly: only a CONFIRMED flag ever blocked a push, and
# that block goes with the check — a coin that would have been blocked now
# pushes, which is the shape of today's "未分析" cards (the detector was
# always best-effort, never a gate). The manual /flow command still works
# (its analyzer is built on demand and costs nothing until used). Restore
# "true" to bring the check — and the line — back.
SUPPLY_FLOW_ENABLED = "false"

# Supply-flow (rug/distribution) per-coin budget. Two jobs: the upper bound
# for what the analyzer may spend, and the unit the gate's start guard uses.
# 2026-09-16: the guard compared the remaining tick time against this budget
# with 15s as the default — larger than the whole scan deadline (~4.2s) — so
# the gate deferred on EVERY coin and the check was silently dead (every card
# showed 未分析). The guard now uses a 1.2s floor with this as the slice cap,
# and the hard cap is clamped to the tick's remaining time, so the analysis
# can neither be dead nor outlive the tick. Verdicts are cached per mint for
# SUPPLY_FLOW_REFRESH_MIN, so re-sweeps cost 0 RPC.
SUPPLY_FLOW_BUDGET_MS = "1500"
# Flurry launch forensics per-coin budget. 2026-09-16: 2s → 1.2s, tracking
# the re-cut tick ladder. The scan now reserves a GATE window for the
# gate/push phase (scanner.ts SCAN_GATE_RESERVE_MS): the front phases must
# all be done by 2.6s, the scan's internal deadline is 4.2s and the worker's
# race cuts at ~4.5-5.0s so the completion flush always lands (see
# SCAN_TICK_BUDGET_MS in worker.ts). The guard defers when less than the
# budget remains, so this value must stay below the reserve — at 1.2s the
# gate still runs on a normal tick (the gate phase starts with ~1.6s left)
# while a slow tick defers it (fail-open: the coin still pushes). Verdicts
# are cached per mint, so a deferred coin is analyzed on the next sweep at
# 0 extra RPC.
FLURRY_BUDGET_MS = "1200"
PUSH_WATCH_WINDOW_HOURS = "26"
# Birdeye holder probe: how long ONE probe may take, ms. A probe is BILLED
# whether or not its count lands, so this is the hit-rate dial, not a latency
# knob: the endpoint measured 1_008–2_525ms from the Worker's own egress on
# 2026-09-23 (/debug/birdeye-overview on a live tracked mint), where the same
# probe read 303–907ms two days earlier. At the old 1_200 the four probes a
# pass started collected ONE count and parked three rows for ten minutes
# (`probe4 miss3`), i.e. three paid calls thrown away every pass. Lower it only
# to bound the pass, never to save CU.
PUSH_WATCH_HOLDER_CAP_MS = "2400"
# Birdeye CU budget: minimum MINUTES between holder probes (0 = off). The free
# tier is 30_000 CU/month and /defi/token_overview is 20 CU, i.e. ~50 calls a
# DAY for the whole bot — while the 1-minute cron probing once a pass would be
# 1_440 calls/day (28_800 CU/DAY). 60 = 24 probes/day ≈ 480 CU/day ≈ 14.4K
# CU/month, which leaves the card path and the periodic new_listing backfill
# inside the quota. At 30 minutes the stage alone is ~28.8K CU/month (the whole
# free tier); at 10 it is ~86K. Raise this only against a PAID plan.
# The stamp is durable (worker_state.holder_probe_at), so the cap holds across
# isolates; rows the gap skips stay DUE (`cut` in the pass note, plus `cu-gate`).
# Birdeye HOLDER PROBES per pass, 0 = the holder stage is switched OFF.
# SET TO 0 on 2026-09-30 (「暫停 Birdeye 持倉探測同 CU 消耗」): the holder cards
# (📈 持倉增長 / ⚡ 籌碼集中) are muted anyway, so the probes only burned CU —
# `/defi/token_overview` is 20 CU a call and the month's ledger showed 193 such
# calls (3,860 of 8,060 CU). 0 removes the WHOLE stage (`if (birdeye &&
# cfg.maxHolderChecksPerTick > 0)`): no fetch, no `holder_probe_at` read, no
# holder count written, and no `probe`/`miss` in the pass note. The Birdeye
# account itself stays wired — the scanner's new-listing backfill
# (BIRDEYE_BACKFILL_ENABLED) still uses it, and `/health.birdeyeCu` keeps
# reporting. Set back to a positive number (default 4, hard ceiling 10) and
# redeploy to resume probing; the counts simply resume from the next due row.
PUSH_WATCH_MAX_HOLDER_CHECKS = "0"
PUSH_WATCH_HOLDER_MIN_GAP_MIN = "60"
# Tracker card types to SILENCE for now, comma-separated card sigs (empty = none):
#   liqwarn = ⚠️ 流動性跌穿地板 (first sub-floor reading)
#   drain   = 💧 流動性枯竭 (second reading — the row still terminalizes)
#   recap   = 🏁 結案報告 (window close — the row is still pruned)
#   hold    = 📈 持倉增長 (baseline still rolls forward — see isMuted)
#   div     = ⚡ 籌碼集中 (the div mark still lands)
#   sell    = 🩸 賣壓主導 (the streak + its 1h pace clock still land)
#   w35/w45 = ⚠️ 動能轉弱 — BOTH depth stages, because the card fires with
#             `weakMark` (`w45` at ≤ -45% off the peak, `w35` above it):
#             muting only one leaves the other visible. The mark still lands.
#   pullback = 🪝 回調轉強 (entry re-card). Its memory is the once-per-episode
#             `pb` mark AND the shared `lastAlertAt` pace clock
#             (PULLBACK_PACE_MS 10 min): fire() still stamps both, so lifting
#             the mute waits for the NEXT episode instead of replaying this one.
# SET 2026-09-30 at the operator's request (「暫時不想收到」; extended the same
# day with 「暫時不需要推送：賣壓主導、動能轉弱」, then with
# 「暫時不需要推送跟進卡：🪝 回調轉強」). A muted card is
# still DERIVED and its transition still LANDS (a muted drain still goes rug,
# a muted recap still closes the row); only the Telegram send is withheld, and
# the pass note counts them as `muted N`. Lifting a mute = delete its sig here
# (or the whole line) and redeploy: the NEXT transition is delivered, nothing
# is replayed. See PushWatcher.isMuted.
PUSH_WATCH_MUTE = "liqwarn,drain,recap,hold,div,sell,w35,w45,pullback"
# Birdeye CU allowance per calendar month (code default 30_000 = the free
# tier). REPORTING ONLY: the client charges every request attempt (per-endpoint
# prices live in src/birdeye.ts BIRDEYE_CU_PRICES) and a durable day ledger sums
# it, so /health.birdeyeCu shows { today, monthCu, pendingCu, monthlyMax } —
# i.e. how much of the 30K the whole bot has actually spent this month, instead
# of §4.4.2's estimate derived from the push count. 2026-09-23: that estimate
# says the CARD path alone (40–52 pushes × 20 CU token_overview) can consume the
# entire tier, so watch `monthCu` here before tuning anything else. WHICH paid
# calls to refuse once the ceiling is reached is deliberately NOT wired —
# dropping one changes what the card shows (docs/round-trips.md §4.4.2 / §4.5.1).
BIRDEYE_MONTHLY_CU_MAX = "30000"
