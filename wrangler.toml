name = "solana-meme-bot"
main = "src/worker.ts"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]

# Cron fires every minute (the free-tier minimum); the scan itself is
# gated by SCAN_INTERVAL_SECONDS below (60s → every tick runs a scan, the
# fastest cadence the 1-min cron can drive). If the upstream API pressure
# (GeckoTerminal 429s) ever returns, raise this back to 90 (every other
# tick) — the re-eval pool + Birdeye backfill keep coverage during the gap.
[triggers]
crons = ["* * * * *"]

# Non-secret tuning knobs. Secrets (TELEGRAM_BOT_TOKEN, TURSO_DATABASE_URL,
# TURSO_AUTH_TOKEN, BIRDEYE_API_KEY, HELIUS_API_KEY) must NOT live here — set
# them in the Cloudflare dashboard (Workers > solana-meme-bot > Settings >
# Variables and Secrets) or via `wrangler secret put <NAME>`.
[vars]
# Minimum gap between scans, in seconds. The cron trigger still fires every
# minute, but the worker skips the scan when the previous one finished less
# than this long ago (cross-isolate via the DB heartbeat). 60 = scan every
# minute — the fastest cadence the 1-min cron can drive: hot-zone push
# latency for coins that qualify inside the age window is ~1 min. 90 = scan
# every ~2 min, halving GeckoTerminal / DexScreener / Birdeye call volume
# and Turso rows-read (the 2026-08-16 mitigation for the sustained gecko
# 429s — restore it if those return; the gecko client's 5-min backoff and
# the Birdeye backfill are the safety nets at the 60s cadence).
SCAN_INTERVAL_SECONDS = "60"
# Max coverage: inspect the newest 100 Solana token profiles per scan
# (the code caps this at 100). Deferred candidates stay in the re-eval
# pool, so nothing is lost when a tick runs out of budget.
SCAN_PROFILE_LIMIT = "100"
# Re-evaluation pool: never-pushed coins nearing/inside the qualifying age
# window that the bot keeps tracking until they qualify (code default 40,
# max 1000). Ordered by relevance, so the closest-to-qualifying coins are
# always checked first; leftovers simply defer to the next tick.
RE_EVAL_POOL_SIZE = "1000"
# Graduated re-eval pool rotation (see src/db.ts): everything older than the
# hot zone (window entry ± margin, evaluated EVERY scan) is swept in two
# tiers. NEAR tier = the first 6h inside the age window — the coins most
# likely to cross the gates after entering — swept every REEVAL_NEAR_SWEEP_MIN
# (default 10). FAR tier = the older tail, swept every REEVAL_FAR_SWEEP_MIN
# (default 30) — every coin is still re-checked at least once per sweep, but
# the old tail stops consuming most of the budget. Rotation bands order by
# the highest mcap ever observed, and coins repeatedly seen below half the
# market-cap gate are dropped from the pool (pre-qualification filter), so
# the sweep budget concentrates on realistic candidates. Slots = sweep ÷ the
# 5-min pool cache (2 near + 6 far at the defaults). The far zone is the
# sparse older tail, so wider bands stay cheap — the floor is 2 slots = a
# 10-min sweep if it ever needs to be faster.
REEVAL_NEAR_SWEEP_MIN = "10"
REEVAL_FAR_SWEEP_MIN = "30"
# pump.fun discovery: DexScreener's profiles feed only returns ~24 Solana
# coins per scan, so also register the newest pump.fun coins (code default
# 100, max 300) into the re-eval pool every scan. Best-effort — if pump.fun
# blocks the caller, discovery returns empty and scanning continues on
# DexScreener alone (see /health summary.pump).
PUMPFUN_PROFILE_LIMIT = "100"
PUMPFUN_REQUEST_INTERVAL_MS = "350"
# GeckoTerminal new-pools discovery (free, no key): newest Solana pools
# across every DEX incl. pump.fun graduates. Pages × 20 pools per scan
# (page size fixed at 20; each page ≈ 1 min of launches). Measured 2026-08-14:
# 5 pages/scan triggers GeckoTerminal's 429 rate-limit window within one
# round, so 2 pages is the stable maximum at the 60s scan cadence (~2 req/
# min; deeper coverage is provided by the Birdeye periodic backfill below,
# which is the safety net for any gap the shallow window leaves).
GECKOTERMINAL_POOL_PAGES = "2"
# GeckoTerminal trending-pools momentum feed (free, no key) — the
# replacement for GMGN trending (GMGN's edge blocks Cloudflare Worker
# egress). 0 = disabled; default 20 (max 20 per call). NOTE: measured
# 2026-08-16 — GeckoTerminal rate-limits Cloudflare Worker egress (shared
# IP pool) with sustained 429s on trending_pools, which also started
# starving new_pools. The client now backs off ALL gecko calls for 5 min
# after one 429 and self-recovers; a round with geo/geoTrend 0 while the
# feed is in backoff is expected, not an outage (the re-eval pool + Birdeye
# backfill cover the gap). /debug/gecko-trending probes the raw status.
GECKOTERMINAL_TRENDING_LIMIT = "20"
GECKOTERMINAL_REQUEST_INTERVAL_MS = "1000"
DEX_REQUEST_INTERVAL_MS = "350"
BIRDEYE_REQUEST_INTERVAL_MS = "1100"
# GMGN OpenAPI (requires GMGN_API_KEY, a SECRET — set in the Cloudflare
# dashboard, never here): (a) enriches qualifying candidates with
# smart-money / wash-trading / holder data before pushing
# (GMGN_BLOCK_WASH_TRADING blocks flagged coins, default true), and (b)
# adds GMGN Trending as a discovery feed (GMGN_TRENDING_LIMIT, 0 =
# disabled, default 30). KEPT AT 0: GMGN's edge returns a bare 429 to
# Cloudflare Worker egress (verified 2026-08-16 — same key works from
# other IPs), so the feed/enrichment stay dormant until access is
# confirmed (paid tier / IP whitelist / proxy). /debug/gmgn probes it.
GMGN_TRENDING_LIMIT = "0"
GMGN_REQUEST_INTERVAL_MS = "600"
GMGN_BLOCK_WASH_TRADING = "true"
# Arkham Intelligence (requires ARKHAM_API_KEY, a SECRET — set in the
# Cloudflare dashboard, never here): smart-money attribution on push cards.
# Each qualifying coin's top-100 holders are checked for entity types in
# ARKHAM_SMART_MONEY_TYPES (funds/whales/investors/traders/MMs by default);
# the card shows the smart-money count + top names. Display-only (no
# blocking). 30 credits/call — the free trial's 1M credits ≈ 33K calls.
# KEPT DORMANT (2026-08-16): opted out — do NOT set ARKHAM_API_KEY until
# reactivating. The client is key-gated: without the secret no calls are
# made and the card shows 未配置. /debug/arkham?address=<mint> probes it.
ARKHAM_REQUEST_INTERVAL_MS = "300"
ARKHAM_SMART_MONEY_TYPES = "fund,hedgefund,hedge_fund,investor,marketmaker,market_maker,trader,vc,venture,whale"
RUGCHECK_REQUEST_INTERVAL_MS = "800"
HELIUS_REQUEST_INTERVAL_MS = "300"
# Periodic Birdeye new_listing backfill (safety net for discovery gaps):
# every BIRDEYE_BACKFILL_INTERVAL_MIN the scanner walks back
# BIRDEYE_BACKFILL_LOOKBACK_MIN of Birdeye's fresh-launch feed (includes
# pump.fun launches via meme_platform_enabled=true) and seeds unseen coins
# into the re-eval pool. Catches coins created while the monitor paused
# (GeckoTerminal's newest-pools pages roll past them). CU-bounded: 1 request
# per run ≈ ~80 CU, 4 runs/day ≈ ~320 CU/month against the 30K free tier.
BIRDEYE_BACKFILL_ENABLED = "true"
BIRDEYE_BACKFILL_INTERVAL_MIN = "360"
BIRDEYE_BACKFILL_LOOKBACK_MIN = "360"
# On-chain supply-flow (rug/distribution) detector: flags coins whose
# holders feed tokens to one collector wallet that keeps selling, then blocks
# the push. Two views feed the same graph: each top account's OUT transfers
# (who it fed) AND, when CHECK_INFLOW is on, its IN transfers (who fed it) —
# so distributed feeders that are not themselves top holders still surface
# when they converge on one big wallet. LP accounts never count as a feeder
# or collector. Defaults catch clear-cut distribution (3+ feeders, >=1% of
# supply consolidated, collector sold 3+ times in 12h).
SUPPLY_FLOW_ENABLED = "true"
SUPPLY_FLOW_MIN_FEEDERS = "3"
SUPPLY_FLOW_MIN_FED_PCT = "1"
SUPPLY_FLOW_MIN_SELLS = "3"
SUPPLY_FLOW_WINDOW_HOURS = "12"
SUPPLY_FLOW_REFRESH_MIN = "30"
SUPPLY_FLOW_TOP_ACCOUNTS = "10"
# Inbound-transfer analysis doubles the gTFA calls per coin (more Helius
# credits); set to false if the credit budget gets tight.
SUPPLY_FLOW_CHECK_INFLOW = "true"
# ---------------------------------------------------------------------------
# Jupiter direct trading (REAL MONEY — off by default, nothing ever buys
# until you opt in). The trading wallet's base58 private key
# (BOT_WALLET_PRIVATE_KEY) is a SECRET: set it in the Cloudflare dashboard,
# never here. Use a NEW dedicated wallet funded with a small SOL amount —
# never the main wallet.
#   TRADE_MODE:
#     off    = disabled (default)
#     manual = push cards get a "🛒 買入" button; one tap = one buy
#     auto   = buy immediately after a qualifying coin is pushed
# TRADE_AMOUNT_SOL is the SOL size per buy (input side of the swap). Start
# tiny (e.g. 0.01) and verify with /debug/trade (read-only: wallet balance +
# a tiny SOL→USDC quote, no spend) before going live.
# Dashboard changes to these trade settings (including adding/removing
# BOT_WALLET_PRIVATE_KEY and flipping TRADE_MODE) take effect WITHOUT a
# redeploy: the worker detects the binding change and re-initializes.
TRADE_MODE = "manual"
# Buy size: TRADE_BUY_BALANCE_PCT (1–100) buys that % of the CURRENT wallet
# balance, computed live at execution time (both manual button and auto).
# Set to 0 to fall back to the fixed TRADE_AMOUNT_SOL size instead.
TRADE_BUY_BALANCE_PCT = "80"
TRADE_AMOUNT_SOL = "0.01"
TRADE_SLIPPAGE_PCT = "25"
TRADE_PRIORITY_FEE_SOL = "0.001"
TRADE_MAX_DAILY_BUYS = "5"
TRADE_TIMEOUT_MS = "15000"
# Telegram user IDs (comma-separated) allowed to run /setmode and tap the
# 🛒 buy button. Leave empty (or unset) to lock both (fail-closed). Find
# your ID with @userinfobot. NOTE: /setmode stores a durable override in the
# DB that wins over TRADE_MODE until it is changed again.
BOT_ADMIN_IDS = "530602939"
# Axiom Trade trending feed. Two auth paths: (a) email+password — set
# AXIOM_EMAIL + AXIOM_PASSWORD as SECRETS (Cloudflare dashboard, never
# here) and do a one-time OTP login via /debug/axiom-login; (b) Google/SSO
# accounts (no password) — log in on axiom.trade in your browser, copy the
# auth-access-token + auth-refresh-token cookies, and store them via
# /debug/axiom-tokens?access=...&refresh=... Either way the tokens live in
# worker_state and are auto-refreshed by the scanner. 0 = disabled; default
# 20 per scan.
# KEPT AT 0: the trending endpoint IS reachable from the worker (verified
# 2026-08-16: HTTP 200 with real data), but the refresh-access-token
# endpoint sits behind Cloudflare Bot Management — it 418s every
# non-browser TLS fingerprint (worker fetch / curl; cf-ray confirms the
# edge, not the app, answers), while access tokens only live ~16 min
# (JWT exp). So the feed cannot self-renew from the worker and dies with
# each token. /debug/axiom-tokens stores tokens, /debug/axiom-refresh
# probes the blocked endpoint, /debug/axiom-trending probes the feed.
AXIOM_TRENDING_LIMIT = "0"
# Jupiter Swap API v1 (Metis) — the old v6 quote-api.jup.ag endpoints are
# retired. Keyless works at 0.5 RPS; set JUPITER_API_KEY (a SECRET, via the
# dashboard or `wrangler secret put`) as the x-api-key header to unlock
# higher rate limits on the new developer platform (developers.jup.ag).
JUPITER_API_BASE = "https://api.jup.ag"
